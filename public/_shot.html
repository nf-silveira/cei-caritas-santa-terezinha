<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; overflow: hidden; background: #fff">
    <iframe id="f" style="border: 0; display: block"></iframe>
    <script>
      const p = new URLSearchParams(location.search)
      if (p.get('role')) {
        try {
          window.sessionStorage.setItem(
            'cei-portal-demonstracao',
            JSON.stringify({ roleId: p.get('role'), unitId: p.get('unit') || 'unidade-centro' }),
          )
        } catch (error) {
          document.title = 'falha ao semear sessão'
        }
      }
      const f = document.getElementById('f')
      f.style.width = (p.get('w') || 320) + 'px'
      f.style.height = (p.get('h') || 1150) + 'px'
      f.src = p.get('path') || '/portal/login'
    </script>
  </body>
</html>
